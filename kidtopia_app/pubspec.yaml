version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.0.0

  flutter_localizations:
    sdk: flutter

  intl: any

  flutter_bloc: ^9.1.1
